name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Copy offline Excel reader
        run: npm run prepare:web

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icon
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1B1F4B' --iconBackgroundColorDark '#1B1F4B'

      - name: Add camera permission
        run: npm run patch:android

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stockroom-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
