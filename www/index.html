<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stockroom</title>
<meta name="theme-color" content="#1B1F4B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231B1F4B'/%3E%3Cpath d='M50 18l26 14v36L50 82 24 68V32z' fill='%23FFB400'/%3E%3Cpath d='M24 32l26 14 26-14M50 46v36' stroke='%231B1F4B' stroke-width='5' fill='none'/%3E%3C/svg%3E">
<script src="xlsx.full.min.js"></script>
<style>
:root{--bg:#F6F4FB;--surf:#fff;--ink:#1B1F4B;--mut:#6B6F94;--acc:#FFB400;--line:#E3E0F0;--ok:#1F9D6B;--low:#E08A00;--out:#D6405A;--tab:#1B1F4B;--tabink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1130;--surf:#191C45;--ink:#F1EFFF;--mut:#9A9DC8;--line:#2B2F66;--tab:#191C45}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:auto}
header{display:flex;align-items:center;gap:12px;padding:14px 18px 8px}
header svg{width:40px;height:40px;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
header h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.02em}
header small{display:block;color:var(--mut);font-size:12px}
#track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#track::-webkit-scrollbar{display:none}
section{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:8px 18px 24px}
.tabs{position:relative;display:flex;margin:0 14px 10px;background:var(--tab);border-radius:18px;padding:4px}
.tabs button{flex:1;z-index:1;background:none;border:0;color:var(--tabink);opacity:.6;padding:11px 0;font:600 13px inherit;font-family:inherit;transition:opacity .25s}
.tabs button.on{opacity:1;color:var(--tab)}
.tabs i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);background:var(--acc);border-radius:14px;transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.tabs button.on{color:#1B1F4B}
input,select{width:100%;font:inherit;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);outline:none;transition:border-color .2s}
input:focus{border-color:var(--acc)}
.srow{display:flex;gap:8px;position:relative}.sug{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px rgba(20,20,60,.22);z-index:8;overflow:hidden;animation:drop .18s ease-out}.sug[hidden]{display:none}.si{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}.si:last-child{border:0}.si:active,.si:hover{background:var(--bg)}.si b{font-size:15px}.si .d{color:var(--mut);font-size:12px;margin-left:6px}.si small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.cl{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px}.cl span{display:flex;align-items:center;gap:5px}.cl b{font-size:12px}.sz{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}.sz i{font-style:normal;font-size:11px;font-weight:600;padding:2px 7px;border-radius:7px;background:var(--bg);border:1px solid var(--line)}.sz i.z{opacity:.35;text-decoration:line-through}.si em{font-style:normal;font-weight:800}.si em.ok{color:var(--ok)}.si em.low{color:var(--low)}.si em.out{color:var(--out)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}.scan{flex:0 0 54px;border:0;border-radius:14px;background:var(--acc);display:grid;place-items:center;transition:transform .15s}.scan:active{transform:scale(.92)}.scan svg{width:26px;height:26px}
#cam{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column}#cam.show{display:flex}#cam video{flex:1;object-fit:cover;min-height:0}#cam .frame{position:absolute;left:12%;right:12%;top:30%;height:30%;border:3px solid var(--acc);border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}#cam .frame:after{content:"";position:absolute;left:6px;right:6px;height:2px;background:var(--acc);animation:sweep 1.6s ease-in-out infinite alternate}#cam button{margin:16px;padding:14px;border:0;border-radius:14px;font:800 16px inherit;background:#fff;color:#1B1F4B}
@keyframes sweep{from{top:8px}to{top:calc(100% - 10px)}}
#flt{flex-wrap:nowrap;overflow-x:auto;margin:10px 0 0;scrollbar-width:none}#flt::-webkit-scrollbar{display:none}#flt .chip{white-space:nowrap;flex:0 0 auto;padding:8px 12px;font-size:13px}#flt small{opacity:.6}
.card{align-items:flex-start}.mw{overflow-x:auto;max-width:100%}
.mt{border-collapse:separate;border-spacing:3px;font-size:12px;margin:6px 0 0 -3px}.mt th{color:var(--mut);font-weight:600;padding:0 2px}.mt td{text-align:center;border-radius:7px;padding:5px 6px;font-weight:700;min-width:30px}.mt td.c{text-align:left;white-space:nowrap;font-weight:600;padding-left:3px}.mt td.ok{background:rgba(31,157,107,.16);color:var(--ok)}.mt td.low{background:rgba(224,138,0,.2);color:var(--low)}.mt td.zr{color:var(--mut);opacity:.5;font-weight:400}.mt td.na{opacity:.25}
.sub{color:var(--mut);font-size:13px;margin:10px 2px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.97)}
.card b{font-size:16px}.card .m{color:var(--mut);font-size:12px}
.grow{flex:1;min-width:0}
.badge{font-weight:800;font-size:18px;text-align:right}.badge small{display:block;font-size:11px;font-weight:400;color:var(--mut)}
.dots{display:flex;gap:4px;margin-top:6px}.dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,128,.4)}
.sheet{position:fixed;inset:0;background:rgba(10,10,40,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.show{display:flex;animation:fade .25s}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .4s cubic-bezier(.2,1.1,.3,1)}
.panel h2{margin:0;font-size:24px;letter-spacing:-.02em}
.x{float:right;border:0;background:var(--line);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px}
.grid{width:100%;border-collapse:separate;border-spacing:4px;margin-top:14px;font-size:14px}
.grid th{color:var(--mut);font-weight:600;font-size:12px}
.grid td.c{text-align:left;font-weight:600;white-space:nowrap}
.q{text-align:center;border-radius:10px;padding:10px 0;font-weight:800;animation:pop .45s backwards}
.q.ok{background:rgba(31,157,107,.15);color:var(--ok)}.q.low{background:rgba(224,138,0,.18);color:var(--low)}.q.out{background:rgba(214,64,90,.14);color:var(--out)}.q.na{opacity:.3}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);font:600 14px inherit;font-family:inherit;display:flex;gap:6px;align-items:center;transition:all .2s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:scale(1.05)}
.chip.dis{opacity:.35}
.btn{width:100%;padding:16px;border-radius:16px;border:0;background:var(--acc);color:#1B1F4B;font:800 16px inherit;font-family:inherit;transition:transform .15s}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.4}
.step{display:flex;align-items:center;justify-content:center;gap:22px;margin:6px 0 16px}
.step button{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);font-size:24px}
.step span{font-size:34px;font-weight:800;min-width:50px;text-align:center}
.drop{border:2px dashed var(--mut);border-radius:22px;padding:30px 16px;text-align:center;margin:8px 0 14px;cursor:pointer;transition:background .2s}
.drop:hover{background:var(--surf)}.drop svg{width:44px;height:44px;animation:float 2.4s ease-in-out infinite}
.map{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.map label{font-size:12px;color:var(--mut)}
.log{font-size:13px;display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line)}
.log a{color:var(--out);font-weight:600}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:30px;opacity:0;pointer-events:none;transition:.35s;z-index:20;font-weight:600;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes float{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div id="app">
<header>
<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#1B1F4B"/><path d="M50 18l26 14v36L50 82 24 68V32z" fill="#FFB400"/><path d="M24 32l26 14 26-14M50 46v36" stroke="#1B1F4B" stroke-width="5" fill="none"/></svg>
<div><h1>Stockroom</h1><small id="meta">Loading…</small></div>
</header>
<div id="track">
<section id="p0">
<div class="srow"><input id="q" placeholder="Search style, name or colour" autocomplete="off"><button class="scan" data-scan="look" aria-label="Scan barcode"><svg viewBox="0 0 24 24" fill="none" stroke="#1B1F4B" stroke-width="2.2" stroke-linecap="round"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M7 9v6M11 9v6M15 9v6M18 9v6"/></svg></button><div class="sug" id="sugq" hidden></div></div>
<div class="chips" id="flt"></div><div class="sub" id="cnt"></div><div id="list"></div>
</section>
<section id="p1">
<div class="drop" id="drop"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M24 34V10M14 20l10-10 10 10M8 38h32"/></svg>
<div style="font-weight:800;font-size:18px;margin-top:8px">Upload fresh SOH</div><div class="sub">Tap to pick an Excel or CSV file</div>
<input id="file" type="file" accept=".xlsx,.xls,.csv" hidden></div>
<div id="mapbox" hidden>
<div class="sub">Check that columns match your file</div>
<div class="map" id="mapsel"></div>
<button class="btn" id="apply">Update stock</button>
</div>
<div class="sub" id="upinfo"></div>
</section>
<section id="p2">
<div class="srow"><input id="sq" placeholder="Find the style you sold" autocomplete="off"><button class="scan" data-scan="sold" aria-label="Scan barcode"><svg viewBox="0 0 24 24" fill="none" stroke="#1B1F4B" stroke-width="2.2" stroke-linecap="round"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M7 9v6M11 9v6M15 9v6M18 9v6"/></svg></button><div class="sug" id="sugs" hidden></div></div>
<div id="sres"></div>
<div id="sform" hidden>
<div style="margin-top:8px;font-weight:800;font-size:20px" id="sname"></div>
<div class="sub">Colour</div><div class="chips" id="scol"></div>
<div class="sub">Size</div><div class="chips" id="ssz"></div>
<div class="step"><button id="mi">−</button><span id="sn">1</span><button id="pl">+</button></div>
<button class="btn" id="sold" disabled>Add sold</button>
</div>
<div class="sub" style="margin-top:20px">Sold in this session</div><div id="log"></div>
</section>
</div>
<nav class="tabs"><i id="ind"></i><button class="on">Lookup</button><button>Upload</button><button>Sold</button></nav>
</div>
<div id="cam"><video id="camv" playsinline muted></video><div class="frame"></div><button id="camx">Close camera</button></div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const DEMO=[];
[["TS-101","Crew Tee",["White","Black","Navy"],["S","M","L","XL"]],["JN-220","Slim Jeans",["Blue","Black"],["28","30","32","34"]],["HD-330","Zip Hoodie",["Grey","Maroon","Olive"],["M","L","XL"]]].forEach(([s,d,cs,zs])=>cs.forEach(c=>zs.forEach(z=>DEMO.push({style:s,desc:d,color:c,size:z,qty:Math.floor(Math.random()*14),barcode:'89'+(s+c+z).split('').reduce((a,ch)=>(a*31+ch.charCodeAt(0))%1e10,7)}))));
let rows=[],sold=[],sel={},qty=1,raw=null,upName="";
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const PRE=(typeof PRELOAD!=='undefined')?PRELOAD.map(a=>({style:a[0],color:a[1],size:a[2],qty:a[3],barcode:a[4],sub:a[5],desc:a[5],mrp:a[6]})):null;
const saved=store.get('soh');if(saved&&saved.rows&&saved.rows.length){rows=saved.rows;upName=saved.name}else if(PRE){rows=PRE;upName='1510.xlsx'}else{rows=DEMO;upName="Sample data - upload your SOH"}
sold=store.get('sold')||[];
const CM={white:'#fff',black:'#111',navy:'#1B2A5B',blue:'#2F6FDE',red:'#D6302F',grey:'#9AA0A6',gray:'#9AA0A6',maroon:'#7A1F3D',olive:'#6B7A2F',green:'#2E9F5B',beige:'#D8C3A5',pink:'#F28DB2',yellow:'#F5C518',orange:'#F28C28',brown:'#7B4B2A',purple:'#7A4DC8',cream:'#F3EAD3',khaki:'#BDB76B',teal:'#1E8C8C',sky:'#7CC4F2',mustard:'#D9A521'};
const col=n=>{const k=String(n).toLowerCase();for(const w in CM)if(k.includes(w))return CM[w];let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))%360;return`hsl(${h},55%,55%)`};
const ORD=['XXS','XS','S','M','L','XL','XXL','2XL','3XL','FREE'];
const sk=z=>{const i=ORD.indexOf(String(z).toUpperCase());return i>=0?i:(parseFloat(z)||999)};
const styles=()=>{const m={};rows.forEach(r=>{(m[r.style]=m[r.style]||{style:r.style,desc:r.desc,rows:[],total:0}).rows.push(r);m[r.style].total+=r.qty;if(r.desc)m[r.style].desc=r.desc;m[r.style].sub=r.sub||'';m[r.style].mrp=r.mrp||0});return Object.values(m)};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)};
const cls=n=>n<=0?'out':n<=3?'low':'ok';
function count(el,to){let s=performance.now();const f=t=>{const p=Math.min(1,(t-s)/600);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function head(){$('#meta').textContent=`${styles().length} styles · ${rows.reduce((a,r)=>a+r.qty,0)} pcs · ${upName}`}
function match(q){q=q.trim().toLowerCase();return styles().filter(s=>!q||(s.style+' '+(s.desc||'')+' '+s.rows.map(r=>r.color).join(' ')).toLowerCase().includes(q))}
function meta(s){const cm={},zm={};s.rows.forEach(r=>{cm[r.color]=(cm[r.color]||0)+r.qty;zm[r.size]=(zm[r.size]||0)+r.qty});return{cs:Object.entries(cm),zs:Object.entries(zm).sort((a,b)=>sk(a[0])-sk(b[0]))}}
const flt={sub:'',stock:false};
function tbl(s){const M=meta(s),zs=M.zs.map(a=>a[0]),cs=M.cs.map(a=>a[0]),g={};s.rows.forEach(r=>g[r.color+'|'+r.size]=r.qty);
return`<table class="mt"><tr><th></th>${zs.map(z=>`<th>${z}</th>`).join('')}</tr>${cs.map(c=>`<tr><td class="c"><i class="dot" style="background:${col(c)};display:inline-block;vertical-align:-2px;margin-right:5px"></i>${c}</td>${zs.map(z=>{const v=g[c+'|'+z];return v===undefined?'<td class="na">·</td>':`<td class="${v>3?'ok':v>0?'low':'zr'}">${v}</td>`}).join('')}</tr>`).join('')}</table>`}
function renderFilters(){const c={};styles().forEach(x=>{if(x.sub)c[x.sub]=(c[x.sub]||0)+1});const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8);
$('#flt').innerHTML=`<button class="chip ${flt.stock?'on':''}" data-f="stock">In stock</button><button class="chip ${!flt.sub?'on':''}" data-f="sub:">All</button>`+top.map(([n,k])=>`<button class="chip ${flt.sub===n?'on':''}" data-f="sub:${n}">${n} <small>${k}</small></button>`).join('')}
$('#flt').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const f=b.dataset.f;if(f==='stock')flt.stock=!flt.stock;else flt.sub=f.slice(4);renderFilters();renderList()};
function renderList(){const L=match($('#q').value).filter(x=>(!flt.sub||x.sub===flt.sub)&&(!flt.stock||x.total>0));
$('#cnt').textContent=L.length+' style'+(L.length==1?'':'s')+(L.length>30?' · showing 30, type to narrow':'');
$('#list').innerHTML=L.slice(0,30).map(x=>`<div class="card" data-s="${x.style}"><div class="grow"><b>${x.style}</b><div class="m">${x.desc||''}${x.mrp?' · ₹'+x.mrp:''}</div><div class="mw">${tbl(x)}</div></div><div class="badge" style="color:var(--${cls(x.total)})">${x.total}<small>in stock</small></div></div>`).join('')||'<div class="sub">No style found. Try a shorter search.</div>'}
$('#list').onclick=e=>{const c=e.target.closest('.card');if(c)openSheet(c.dataset.s)};
function openSheet(st){const s=styles().find(x=>x.style===st);const cs=[...new Set(s.rows.map(r=>r.color))];const zs=[...new Set(s.rows.map(r=>r.size))].sort((a,b)=>sk(a)-sk(b));
const g=(c,z)=>{const r=s.rows.filter(r=>r.color===c&&r.size===z);return r.length?r.reduce((a,r)=>a+r.qty,0):null};
let h=`<button class="x" onclick="closeSheet()">×</button><h2>${s.style}</h2><div class="sub" style="margin-top:2px">${s.desc||''} · <b id="tot"></b> pcs total</div><div style="overflow-x:auto"><table class="grid"><tr><th></th>${zs.map(z=>`<th>${z}</th>`).join('')}<th>Total</th></tr>`;
cs.forEach((c,i)=>{let t=0;h+=`<tr><td class="c"><span class="dot" style="background:${col(c)};display:inline-block;vertical-align:-2px;margin-right:6px"></span>${c}</td>`;zs.forEach((z,j)=>{const v=g(c,z);if(v!==null)t+=v;h+=v===null?`<td class="q na">–</td>`:`<td class="q ${cls(v)}" style="animation-delay:${(i*zs.length+j)*25}ms">${v}</td>`});h+=`<td class="q" style="font-weight:800">${t}</td></tr>`});
$('#panel').innerHTML=h+'</table></div><div class="sub">Green is healthy, amber is 3 or fewer, red is sold out.</div>';
$('#sheet').classList.add('show');count($('#tot'),s.total)}
window.closeSheet=()=>$('#sheet').classList.remove('show');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};
function sugList(q){q=q.trim().toLowerCase();if(!q)return[];const L=styles();const a=L.filter(x=>x.style.toLowerCase().startsWith(q)),b=L.filter(x=>!a.includes(x)&&(x.style+' '+(x.desc||'')).toLowerCase().includes(q));return a.concat(b).slice(0,6)}
function showSug(input,box,pick){const L=sugList(input.value);if(!L.length){box.hidden=true;return}box.innerHTML=L.map(x=>`<div class="si" data-s="${x.style}"><div style="flex:1;min-width:0"><b>${x.style}</b><span class="d">${x.desc||''}</span><small>${meta(x).cs.map(a=>a[0]).join(', ')} · ${meta(x).zs.map(a=>a[0]).join(' ')}</small></div><em class="${cls(x.total)}">${x.total}</em></div>`).join('');box.hidden=false;box.onclick=e=>{const i=e.target.closest('.si');if(i){box.hidden=true;input.blur();pick(i.dataset.s)}};input.onkeydown=e=>{if(e.key==='Enter'&&L[0]){box.hidden=true;input.blur();pick(L[0].style)}}}
document.addEventListener('click',e=>{if(!e.target.closest('.srow'))document.querySelectorAll('.sug').forEach(b=>b.hidden=true)});
function pickLook(st){$('#q').value=st;renderList()}
function pickSold(st){const x=styles().find(y=>y.style===st);if(!x)return;$('#sq').value=st;sel={s:x,c:null,z:null};qty=1;$('#sn').textContent=1;$('#sres').innerHTML='';$('#sname').textContent=x.style+(x.desc?' · '+x.desc:'');$('#sform').hidden=false;chips()}
$('#q').oninput=()=>{renderList();showSug($('#q'),$('#sugq'),pickLook)};
/* Tabs */
const tr=$('#track'),tb=[...document.querySelectorAll('.tabs button')];
function go(i){tr.scrollTo({left:i*tr.clientWidth,behavior:'smooth'})}
tb.forEach((b,i)=>b.onclick=()=>go(i));
tr.onscroll=()=>{const p=tr.scrollLeft/tr.clientWidth;$('#ind').style.transform=`translateX(${p*100}%)`;const i=Math.round(p);tb.forEach((b,j)=>b.classList.toggle('on',i===j))};
/* Upload */
/*PARSE*/
const FIELDS=[['style','Style',/style|article|sku|design/i],['color','Colour',/colou?r|shade/i],['size','Size',/size/i],['qty','Qty',/qty|quant|soh|stock|avail|on.?hand|bal|closing/i],['barcode','Barcode (optional)',/bar.?code|ean|upc|gtin/i],['sub','Type (optional)',/sub.?cat|type|categ/i],['mrp','MRP (optional)',/^\s*mrp\s*$/i],['desc','Name (optional)',/desc|name|title/i]];
const PRESET={sub:3,barcode:4,style:7,color:8,size:9,mrp:11,qty:12};
const L2=i=>String.fromCharCode(65+i);
function guessMap(aoa){const h=(aoa[0]||[]).map(x=>String(x).trim());const m={};FIELDS.forEach(([k,l,re])=>{const i=h.findIndex(x=>x&&re.test(x));m[k]=i>=0?String(i):''});
 if(!m.style&&h.length>=13)for(const k in PRESET)if(m[k]==='')m[k]=String(PRESET[k]);return m}
const tc=x=>String(x).toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
function buildRows(aoa,m){const has=k=>m[k]!==''&&m[k]!=null,g=(r,k)=>has(k)?r[+m[k]]:'';const map=new Map();
 for(let i=1;i<aoa.length;i++){const r=aoa[i];const st=String(g(r,'style')).trim();if(!st||/total$/i.test(st))continue;
  const q=Number(g(r,'qty'));if(isNaN(q))continue;
  const c=tc(String(g(r,'color')).trim()||'—'),z=String(g(r,'size')).trim().toUpperCase()||'—',k=st+'|'+c+'|'+z;
  const e=map.get(k);if(e){e.qty+=Math.round(q);continue}
  const sub=tc(String(g(r,'sub')).trim());
  map.set(k,{style:st,color:c,size:z,qty:Math.round(q),barcode:String(g(r,'barcode')).trim(),sub,desc:String(g(r,'desc')).trim()||sub,mrp:Number(g(r,'mrp'))||0})}
 return[...map.values()]}
function autoOk(aoa,m){if(['style','color','size','qty'].some(k=>m[k]===''))return false;let n=0,ok=0;for(let i=1;i<aoa.length&&n<300;i++){const r=aoa[i];const st=String(r[+m.style]??'').trim();if(!st||/total$/i.test(st))continue;n++;if(r[+m.qty]!==''&&!isNaN(Number(r[+m.qty]))&&String(r[+m.size]??'').trim()!==''||String(r[+m.color]??'').trim()!=='')ok++}return n>=5&&ok/n>=.9}
/*ENDPARSE*/
$('#drop').onclick=()=>$('#file').click();
function showMap(g){const nc=Math.max(...raw.slice(0,50).map(r=>r.length));
$('#mapsel').innerHTML=FIELDS.map(([k,l])=>`<div><label>${l}</label><select data-k="${k}"><option value="">None</option>${Array.from({length:nc},(_,i)=>{const smp=raw.slice(1,8).map(r=>r[i]).find(v=>v!==''&&v!=null);return`<option value="${i}" ${String(i)===g[k]?'selected':''}>${L2(i)} · ${String(raw[0][i]||smp||'').slice(0,18)}</option>`}).join('')}</select></div>`).join('');$('#mapbox').hidden=false}
function commit(m){if(m.style===''||m.qty==='')return toast('Pick the Style and Qty columns'),false;const nr=buildRows(raw,m);if(!nr.length)return toast('No stock lines found - check the columns'),false;
const was=rows.reduce((a,r)=>a+r.qty,0);rows=nr;sold=[];store.set('sold',sold);store.set('soh',{rows,name:upName});store.set('map',m);flt.sub='';flt.stock=false;$('#mapbox').hidden=true;head();renderFilters();renderList();renderLog();
const now=rows.reduce((a,r)=>a+r.qty,0);toast(`Stock updated · ${styles().length} styles · ${now} pcs`);
$('#upinfo').innerHTML=`<b>Updated:</b> ${upName}<br>${styles().length} styles · ${now} pcs (before: ${was} pcs)<br><a href="#" id="vw" style="color:var(--acc);font-weight:700">View stock</a> &nbsp; <a href="#" id="chk" style="color:var(--mut)">Check columns</a>`;return true}
$('#upinfo').onclick=e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();if(a.id==='vw')go(0);if(a.id==='chk')showMap(store.get('map')||guessMap(raw))};
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
let ws=wb.Sheets[wb.SheetNames[0]];raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
if(raw.length<2&&wb.SheetNames.length>1){ws=wb.Sheets[wb.SheetNames[1]];raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''})}
if(raw.length<2)throw 0;upName=f.name+' · '+new Date().toLocaleDateString([],{day:'numeric',month:'short'});
const g=guessMap(raw);
if(autoOk(raw,g)){commit(g)}
else{const sv=store.get('map');if(sv&&autoOk(raw,sv)){commit(sv)}else{showMap(g);$('#upinfo').textContent=`${raw.length-1} rows read. This file looks different - please check the columns.`}}
}catch(err){toast('Could not read that file')}e.target.value=''};
$('#apply').onclick=()=>{const m={};document.querySelectorAll('#mapsel select').forEach(x=>m[x.dataset.k]=x.value);commit(m)};
/* Sold */
function sRender(){const L=$('#sq').value.trim()?match($('#sq').value).slice(0,6):[];$('#sres').innerHTML=L.map(s=>`<div class="card" data-s="${s.style}"><div class="grow"><b>${s.style}</b><div class="m">${s.desc||''}</div></div><div class="badge">${s.total}</div></div>`).join('')}
$('#sq').oninput=()=>{$('#sform').hidden=true;$('#sres').innerHTML='';showSug($('#sq'),$('#sugs'),pickSold)};
$('#sres').onclick=e=>{const c=e.target.closest('.card');if(!c)return;const s=styles().find(x=>x.style===c.dataset.s);sel={s,c:null,z:null};qty=1;$('#sn').textContent=1;$('#sres').innerHTML='';$('#sname').textContent=s.style+(s.desc?' · '+s.desc:'');$('#sform').hidden=false;chips()};
function chips(){const s=sel.s,cs=[...new Set(s.rows.map(r=>r.color))],zs=[...new Set(s.rows.filter(r=>!sel.c||r.color===sel.c).map(r=>r.size))].sort((a,b)=>sk(a)-sk(b));
$('#scol').innerHTML=cs.map(c=>`<button class="chip ${sel.c===c?'on':''}" data-c="${c}"><span class="dot" style="background:${col(c)}"></span>${c}</button>`).join('');
$('#ssz').innerHTML=zs.map(z=>{const r=s.rows.find(r=>r.size===z&&(!sel.c||r.color===sel.c));const n=sel.c&&r?r.qty:null;return`<button class="chip ${sel.z===z?'on':''} ${n===0?'dis':''}" data-z="${z}">${z}${n!==null?`<small>(${n})</small>`:''}</button>`}).join('');
$('#sold').disabled=!(sel.c&&sel.z)}
$('#scol').onclick=e=>{const b=e.target.closest('.chip');if(b){sel.c=b.dataset.c;sel.z=null;chips()}};
$('#ssz').onclick=e=>{const b=e.target.closest('.chip');if(b){sel.z=b.dataset.z;chips()}};
$('#mi').onclick=()=>{qty=Math.max(1,qty-1);$('#sn').textContent=qty};
$('#pl').onclick=()=>{qty++;$('#sn').textContent=qty};
$('#sold').onclick=()=>{const r=sel.s.rows.find(r=>r.color===sel.c&&r.size===sel.z);if(!r)return;if(r.qty<qty)return toast(`Only ${r.qty} in stock`);r.qty-=qty;sold.unshift({style:sel.s.style,color:sel.c,size:sel.z,n:qty,t:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});store.set('sold',sold);store.set('soh',{rows,name:upName});
toast(`Sold ${qty} · ${r.qty} left`);if(navigator.vibrate)navigator.vibrate(30);head();renderList();renderLog();qty=1;$('#sn').textContent=1;chips()};
function renderLog(){$('#log').innerHTML=sold.length?sold.slice(0,30).map((l,i)=>`<div class="log"><span><b>${l.style}</b> ${l.color} ${l.size} × ${l.n}<br><span class="m" style="color:var(--mut)">${l.t}</span></span><a href="#" data-i="${i}">Undo</a></div>`).join(''):'<div class="sub">Nothing sold yet.</div>'}
$('#log').onclick=e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();const l=sold.splice(+a.dataset.i,1)[0];const r=rows.find(r=>r.style===l.style&&r.color===l.color&&r.size===l.size);if(r)r.qty+=l.n;store.set('sold',sold);store.set('soh',{rows,name:upName});head();renderList();renderLog();toast('Sale undone')};

/* Barcode scanning */
const BS=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.BarcodeScanner;
async function scanCode(){
 const B=BS();
 if(B){
  try{
   const p=await B.requestPermissions();
   if(p.camera!=='granted'&&p.camera!=='limited'){toast('Allow camera access to scan');return null}
   try{const a=await B.isGoogleBarcodeScannerModuleAvailable();if(!a.available){toast('Setting up scanner…');await new Promise(res=>{B.addListener('googleBarcodeScannerModuleInstallProgress',e=>{if([3,4,5].includes(e.state))res()});B.installGoogleBarcodeScannerModule().catch(res)})}}catch(e){}
   const r=await B.scan();return r.barcodes&&r.barcodes[0]?r.barcodes[0].rawValue:null
  }catch(e){return null}
 }
 return webScan()
}
async function webScan(){
 if(!('BarcodeDetector' in window)||!navigator.mediaDevices){toast('Scanner works in the installed app');return null}
 let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){toast('Camera permission denied');return null}
 const v=$('#camv'),cam=$('#cam');v.srcObject=stream;await v.play();cam.classList.add('show');
 const det=new BarcodeDetector();let stop=false;$('#camx').onclick=()=>stop=true;
 const out=await new Promise(res=>{const tick=async()=>{if(stop)return res(null);try{const f=await det.detect(v);if(f.length)return res(f[0].rawValue)}catch(e){}setTimeout(tick,200)};tick()});
 stream.getTracks().forEach(t=>t.stop());cam.classList.remove('show');return out
}
function findCode(code){code=String(code).trim();return rows.find(r=>r.barcode&&r.barcode===code)||rows.find(r=>r.style.toLowerCase()===code.toLowerCase())}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-scan]');if(!b)return;
 const code=await scanCode();if(!code)return;
 const r=findCode(code);if(!r)return toast('No match for '+code);
 if(b.dataset.scan==='look'){$('#q').value='';renderList();openSheet(r.style);toast(`${r.style} · ${r.color} · ${r.size} · ${r.qty} in stock`)}
 else{const s=styles().find(x=>x.style===r.style);sel={s,c:r.color,z:r.size};qty=1;$('#sn').textContent=1;$('#sq').value='';$('#sres').innerHTML='';$('#sname').textContent=s.style+(s.desc?' · '+s.desc:'');$('#sform').hidden=false;chips();toast(`${r.color} · ${r.size} · ${r.qty} in stock`)}
});
head();renderList();renderLog();renderFilters();
</script></body></html>
